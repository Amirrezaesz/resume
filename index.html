  <script>
    const langBtn = document.getElementById("langBtn");
    const allElems = document.querySelectorAll("[data-fa]");
    let currentLang = localStorage.getItem("resumeLang") || "fa";

    function applyLanguage(lang) {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
      langBtn.textContent = lang === "fa" ? "English" : "فارسی";
      allElems.forEach(el => el.innerHTML = el.dataset[lang]);
      localStorage.setItem("resumeLang", lang);
    }

    langBtn.addEventListener("click", () => {
      currentLang = currentLang === "fa" ? "en" : "fa";
      applyLanguage(currentLang);
    });

    applyLanguage(currentLang);
  </script>
